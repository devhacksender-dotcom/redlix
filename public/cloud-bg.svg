<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" fill="none">
    <!-- Main Sky Gradient -->
    <rect width="1440" height="600" fill="url(#skyGradient)"/>

    <!-- Cloud Path 1 (Back left, soft) -->
    <path d="M-100 250 C 50 180, 200 200, 300 260 C 400 320, 500 250, 600 310 C 700 370, 800 300, 950 350 L 950 600 L -100 600 Z" fill="url(#cloudGrad1)" opacity="0.45"/>

    <!-- Cloud Path 2 (Back right, soft) -->
    <path d="M600 350 C 750 280, 900 300, 1050 240 C 1200 180, 1350 220, 1500 180 L 1500 600 L 600 600 Z" fill="url(#cloudGrad1)" opacity="0.5"/>

    <!-- Cloud Path 3 (Front, detailed overlapping curves) -->
    <path d="M-50 400 C 100 320, 250 340, 380 410 C 500 480, 650 380, 800 440 C 950 500, 1100 400, 1250 460 C 1350 500, 1450 430, 1550 470 L 1550 600 L -50 600 Z" fill="url(#cloudGrad2)" opacity="0.85"/>

    <!-- Soft Ambient Lights / Sun glow -->
    <circle cx="720" cy="-200" r="500" fill="url(#sunGlow)" opacity="0.6"/>

    <defs>
        <!-- Gradients -->
        <linearGradient id="skyGradient" x1="720" y1="0" x2="720" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#E8F4FD"/>
            <stop offset="0.6" stop-color="#F4F9FE"/>
            <stop offset="1" stop-color="#FFFFFF"/>
        </linearGradient>

        <linearGradient id="cloudGrad1" x1="720" y1="200" x2="720" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity="0.8"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="cloudGrad2" x1="720" y1="350" x2="720" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F1F8FD" stop-opacity="0.5"/>
        </linearGradient>

        <radialGradient id="sunGlow" cx="720" cy="-200" r="500" fx="720" fy="-200" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
    </defs>
</svg>
